# Deploy with: npm run deploy   (builds, then `npx wrangler deploy`)
name = "mcp-tester"
main = "dist/worker.mjs"
compatibility_date = "2025-09-01"
# Lets the Worker notice when the browser cancels a request, and stop its fetch to the server
compatibility_flags = ["enable_request_signal"]

# Restrict which MCP servers this Worker may proxy to (recommended):
# [vars]
# ALLOWED_ORIGINS = "developer.hsbc.com"
